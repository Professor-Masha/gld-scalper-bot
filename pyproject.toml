[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gld-scalper-bot"
version = "0.1.0"
description = "Paper-only Alpaca GLD scalping bot with SQLite, ML, risk controls, and backtesting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "@Mashcorp" }]
dependencies = [
  "alpaca-py>=0.30.0",
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "joblib>=1.3.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.0",
  "pytest>=8.0.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
transformer = [
  "torch>=2.6.0",
]
onnx = [
  "onnx>=1.17.0",
  "onnxruntime>=1.22.0",
  "onnxscript>=0.2.0",
]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
gld-scalper = "gld_scalper.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gld_scalper = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
